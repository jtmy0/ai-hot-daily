  <h1 class="article-title">Mojo🔥 is now open source!</h1>
  <div class="article-meta">
    <span>作者: No items found.</span>
    <span>来源: Modular</span>
    <span>快照日期: 2026-08-20</span>
  </div>
  <div class="article-body"><div><div><figure><div><p>We are happy to announce that the Mojo🔥 language is now fully open source under <a href="https://github.com/modular/modular/blob/main/LICENSE" target="_blank" rel="noopener noreferrer nofollow">the Apache 2.0 license (with LLVM exceptions)</a>! The source code for the Mojo compiler, tooling, and everything else you need to build the language are now available in <a href="https://github.com/modular/modular" target="_blank" rel="noopener noreferrer nofollow">our </a><a href="https://github.com/modular/modular" target="_blank" rel="noopener noreferrer nofollow"><code>modular</code></a><a href="https://github.com/modular/modular" target="_blank" rel="noopener noreferrer nofollow"> GitHub repository</a>.</p><p>The Mojo language is a bold bet: a novel general purpose programming language that goes further than older ones. Mojo integrates the latest in compiler and programming language research to unlock GPUs, AI accelerators, and other advanced compute. For the last four years, Mojo has been developed with an open community, but a closed compiler. Last week <a href="https://www.modular.com/blog/modular-26-5-mojo-1-0-is-here" target="_blank" rel="noopener noreferrer nofollow">Mojo hit 1.0 </a>(with source stability), and today we’re excited to open source the entire compiler and toolchain.</p><h3>Apache 2: A permissive license</h3><p>The Apache 2.0 license is the gold standard for programming languages and compilers, because it provides great flexibility to be used in all sorts of applications. The LLVM extensions to the license further expand those freedoms for building and distributing binaries compiled from Mojo. We want you to be able to adopt and use Mojo in as many applications as you can imagine.</p><p>Our open source approach has been deliberate: we’ve found that small and tight-knit design teams (not committees) are the best for finding the “soul” of a language, but that feedback from a broader community is essential to escape an echo chamber. As such, we first open-sourced the <a href="https://www.modular.com/blog/the-next-big-step-in-mojo-open-source" target="_blank" rel="noopener noreferrer nofollow">Mojo standard library</a>, then released <a href="https://www.modular.com/blog/modular-platform-25-3-450k-lines-of-open-source-code-and-pip-install-modular" target="_blank" rel="noopener noreferrer nofollow">hundreds of thousands of lines of kernel code written in Mojo</a>, tools, and support. We built together with community feedback and public design proposals, and are now open sourcing the compiler. We will continue to open our processes further as Mojo keeps maturing.</p><h3>How to get and build the compiler</h3><p>All code for the Mojo language is now available at the main <a href="https://github.com/modular/modular" target="_blank" rel="noopener noreferrer nofollow"><code>modular</code></a><a href="https://github.com/modular/modular" target="_blank" rel="noopener noreferrer nofollow"> GitHub repository</a>. First, clone that repository locally:</p><div>
<p><span>bash</span></p><div>
<pre><code><span><span>git</span><span> clone</span><span> https://github.com/modular/modular.git</span></span>
<span></span>
<span><span>cd</span><span> modular</span></span></code></pre>
</div>
</div><p>Then, to build the Mojo compiler from source and run it against a Mojo file you can use a single build command:</p><div>
<p><span>bash</span></p><div>
<pre><code><span><span>./bazelw</span><span> run</span><span> --config=build-mojo</span><span> KGEN:mojo</span><span> --</span><span> run</span><span> hello.mojo</span></span></code></pre>
</div>
</div><p>At Modular, we use <a href="https://bazel.build/" target="_blank" rel="noopener noreferrer nofollow">Bazel</a> to manage the complex build processes and caching for Mojo and MAX. This one command will download or build everything needed to build the Mojo compiler and the Mojo standard library. The flag <code>--config=build-mojo</code> tells the build system to compile everything from scratch, using the source code on your local system.</p><p>This extends to working with the Mojo standard library, where you can modify the compiler or library code and run the full suite of tests via:</p><div>
<p><span>bash</span></p><div>
<pre><code><span><span>./bazelw</span><span> test</span><span> --config=build-mojo</span><span> mojo/stdlib/test/...</span></span></code></pre>
</div>
</div><p>If you aren’t working on the compiler itself, you can use the flag <code>--config=prebuilt-mojo</code> and the build system will download the latest nightly binary distribution of the compiler, saving you some compilation time. Note that a prebuilt Mojo compiler is still necessary today if you are customizing MAX kernels or models.</p><h3>Contributions</h3><p>The Mojo standard library has been accepting contributions since 2024, and we’re grateful for everyone that has helped advance the language. One learning (particularly in today’s era of AI coding) is that we need to be deliberate about how we handle contributions. As such, we aren’t ready to take contributions to the compiler and tooling. We aim to accept contributions to the compiler and tooling by the end of this year, and we’ll share more details when we can.</p><p>To ask any questions about the Mojo compiler source as you read through it, or to share what you’re working on, please join <a href="https://forum.modular.com/" target="_blank" rel="noopener noreferrer nofollow">our forum</a>. Clone the source code and let us know what you’re building with the Mojo language. We’re excited to open Mojo up to the world and see how it grows!</p></div></figure></div></div></div>
