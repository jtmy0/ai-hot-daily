<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>AI 热点日报 — 2026年7月25日</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-outer: #2d2d2d; --bg-page: #f8f6f1; --text-primary: #1a1a1a;
  --text-secondary: #555; --text-muted: #999;
  --tab-1: #98d4bb; --tab-2: #c7b8ea; --tab-3: #f4b8c5; --tab-4: #a8d8ea; --tab-5: #ffe6a7; --tab-6: #d4c5b9;
  --font-display: 'Bodoni Moda', serif; --font-body: 'DM Sans', sans-serif; --border: #e0dcd4;
  --expand-bg: #f0ede8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; }
body { background: var(--bg-outer); font-family: var(--font-body); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: clamp(1rem, 3vw, 3rem); }
.notebook { position: relative; background: var(--bg-page); width: min(92vw, 920px); border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1), 0 20px 60px rgba(0,0,0,0.3); padding: clamp(2rem, 5vw, 4rem); padding-right: clamp(2.5rem, 6vw, 5rem); animation: pageIn 0.6s ease-out; }
.notebook::before { content: ''; position: absolute; left: clamp(14px, 2vw, 24px); top: 0; bottom: 0; width: 2px; background: repeating-linear-gradient(to bottom, transparent 0px, transparent 30px, var(--border) 30px, var(--border) 32px); }
.hole { position: absolute; left: clamp(8px, 1.5vw, 16px); width: clamp(10px, 1.5vw, 16px); height: clamp(10px, 1.5vw, 16px); border-radius: 50%; background: var(--bg-outer); border: 1.5px solid #bbb; }
.hole:nth-child(1) { top: 12%; } .hole:nth-child(2) { top: 50%; } .hole:nth-child(3) { top: 88%; }

.tabs { position: absolute; right: 0; top: 10%; display: flex; flex-direction: column; gap: 4px; z-index: 10; }
.tab { padding: clamp(0.3rem, 0.8vw, 0.6rem) clamp(0.5rem, 1vw, 0.8rem); border-radius: 6px 0 0 6px; font-size: clamp(0.5rem, 1vh, 0.7rem); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(0,0,0,0.6); writing-mode: vertical-rl; text-orientation: mixed; min-height: clamp(40px, 6vh, 60px); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; border: none; background: none; font-family: inherit; }
.tab:hover { transform: translateX(-4px); }
.tab.active { transform: translateX(-6px); box-shadow: -2px 0 8px rgba(0,0,0,0.1); }
.tab[data-cat="all"] { background: var(--text-primary); color: #fff; }
.tab[data-cat="ai"] { background: var(--tab-1); }
.tab[data-cat="dev"] { background: var(--tab-2); }
.tab[data-cat="sec"] { background: var(--tab-3); }
.tab[data-cat="biz"] { background: var(--tab-4); }
.tab[data-cat="auto"] { background: var(--tab-5); }
.tab[data-cat="other"] { background: var(--tab-6); }

.header { margin-bottom: clamp(0.8rem, 2vw, 1.5rem); padding-bottom: clamp(0.6rem, 1.2vw, 1rem); border-bottom: 2px solid var(--text-primary); }
.header h1 { font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2.8rem); font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); }
.header .subtitle { display: flex; justify-content: space-between; align-items: center; margin-top: 0.4rem; flex-wrap: wrap; gap: 0.5rem; }
.header .date { font-family: var(--font-display); font-style: italic; font-size: clamp(0.7rem, 1.1vw, 0.95rem); color: var(--text-secondary); }
.header .controls { display: flex; gap: 0.5rem; }
.header .controls button { font-family: var(--font-body); font-size: clamp(0.55rem, 0.85vw, 0.72rem); padding: 0.25rem 0.6rem; border: 1px solid var(--border); border-radius: 4px; background: #fff; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; }
.header .controls button:hover { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }
.back-link { display: inline-flex; align-items: center; gap: 0.3em; font-size: clamp(0.6rem, 0.9vw, 0.75rem); color: var(--text-muted); text-decoration: none; margin-bottom: clamp(0.4rem, 0.8vw, 0.6rem); transition: color 0.2s; }
.back-link:hover { color: var(--text-primary); }

.entries { padding-left: clamp(0.5rem, 2vw, 1.5rem); }
.entry { border-bottom: 1px solid var(--border); animation: fadeIn 0.4s ease-out backwards; transition: opacity 0.3s; }
.entry.hidden { display: none; }
.entry .entry-head { display: flex; gap: clamp(0.6rem, 1.5vw, 1.2rem); padding: clamp(0.6rem, 1.2vw, 1rem) 0; cursor: pointer; user-select: none; transition: padding-left 0.2s; }
.entry .entry-head:hover { padding-left: 4px; }
.entry .bullet { flex-shrink: 0; width: clamp(6px, 0.8vw, 8px); height: clamp(6px, 0.8vw, 8px); border-radius: 50%; margin-top: 0.55em; transition: transform 0.2s; }
.entry.expanded .bullet { transform: scale(1.5); }
.entry .info { flex: 1; min-width: 0; }
.entry .info h3 { font-family: var(--font-body); font-size: clamp(0.8rem, 1.3vw, 1.05rem); font-weight: 500; line-height: 1.45; color: var(--text-primary); margin-bottom: 0.25rem; }
.entry .info .meta { font-size: clamp(0.6rem, 0.9vw, 0.75rem); color: var(--text-muted); font-style: italic; }
.entry .info .badge-icon { font-size: 0.85em; margin-right: 0.1em; }
.entry .expand-icon { flex-shrink: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; transition: transform 0.3s ease; margin-top: 0.3em; }
.entry.expanded .expand-icon { transform: rotate(180deg); }

.entry .detail-wrap { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
.entry.expanded .detail-wrap { max-height: 500px; }
.entry .detail-inner { padding: clamp(0.5rem, 1vw, 0.8rem) 0 clamp(0.5rem, 1vw, 0.8rem) clamp(1.8rem, 3.5vw, 2.8rem); background: var(--expand-bg); border-radius: 6px; margin-bottom: clamp(0.4rem, 0.8vw, 0.6rem); border-left: 3px solid var(--border); }
.entry .detail-inner p { font-size: clamp(0.72rem, 1.1vw, 0.9rem); line-height: 1.7; color: var(--text-secondary); }
.entry .detail-inner p strong { color: var(--text-primary); font-weight: 600; }
.entry .detail-inner .source-link { display: inline-flex; align-items: center; gap: 0.3em; margin-top: clamp(0.4rem, 0.7vw, 0.6rem); font-size: clamp(0.6rem, 0.9vw, 0.75rem); color: var(--text-muted); text-decoration: none; padding: 0.2rem 0.5rem; border: 1px solid var(--border); border-radius: 4px; transition: all 0.2s; }
.entry .detail-inner .source-link:hover { color: var(--text-primary); border-color: var(--text-primary); background: rgba(0,0,0,0.03); }

.footer { margin-top: clamp(0.8rem, 1.5vw, 1.5rem); padding-top: clamp(0.5rem, 1vw, 1rem); border-top: 1px solid var(--border); font-size: clamp(0.55rem, 0.85vw, 0.7rem); color: var(--text-muted); font-family: var(--font-display); font-style: italic; text-align: center; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
.footer .badge { display: inline-flex; align-items: center; gap: 0.3em; padding: 0.15rem 0.5rem; border: 1px solid var(--border); border-radius: 999px; font-style: normal; font-size: clamp(0.5rem, 0.75vw, 0.6rem); }

@keyframes pageIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.1s !important; } }
</style>
</head>
<body>
  <div class="notebook">
    <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="all" title="全部">ALL</button>
      <button class="tab" data-cat="ai" title="AI/大模型">AI</button>
      <button class="tab" data-cat="dev" title="开发工具">DEV</button>
      <button class="tab" data-cat="sec" title="安全">SEC</button>
      <button class="tab" data-cat="biz" title="商业">BIZ</button>
      <button class="tab" data-cat="auto" title="自动化">AUTO</button>
      <button class="tab" data-cat="other" title="其他">OTHER</button>
    </div>
    <div class="header">
      <a class="back-link" href="./">← 归档首页</a>
      <h1>AI 热点日报</h1>
      <div class="subtitle">
        <span class="date">2026年7月25日，星期六· 含新增 · 道法术器解读</span>
        <div class="controls">
          <button id="expandAll">展开全部</button>
          <button id="collapseAll">收起全部</button>
        </div>
      </div>
    </div>
    <div class="entries" id="entries">
      <div class="entry" data-cat="other" style="animation-delay: 0.1s;">
        <div class="entry-head">
          <div class="bullet" style="background: var(--tab-6);"></div>
          <div class="info">
            <h3><span class="badge-icon"> 🆕</span> ChatGPT/Codex 都</h3>
            <div class="meta">v2ex · 🔥 100</div>
          </div>
          <div class="expand-icon">▼</div>
        </div>
        <div class="detail-wrap"><div class="detail-inner"><a class="source-link" href="https://www.v2ex.com/t/1229754" target="_blank" rel="noopener noreferrer nofollow">阅读原文 ↗</a></div></div>
      </div>
      <div class="entry" data-cat="ai" style="animation-delay: 0.18s;">
        <div class="entry-head">
          <div class="bullet" style="background: var(--tab-1);"></div>
          <div class="info">
            <h3><span class="badge-icon"> 🔄</span> OpenAI 智能体入侵 Hu</h3>
            <div class="meta">IT之家（RSS） · 🔥 100 · 11小时前</div>
          </div>
          <div class="expand-icon">▼</div>
        </div>
        <div class="detail-wrap"><div class="detail-inner"><a class="source-link" href="https://www.ithome.com/0/981/432.htm" target="_blank" rel="noopener noreferrer nofollow">阅读原文 ↗</a></div></div>
      </div>
    </div>
    <div class="footer">
      <span>Generated by AI Hot Monitor v2 · DeepSeek · 20:01:57</span>
      <span class="badge">💡 点击条目展开深度解读</span>
    </div>
  </div>
<script>
document.querySelectorAll('.entry .entry-head').forEach(h => h.addEventListener('click', () => h.closest('.entry').classList.toggle('expanded')));
document.getElementById('expandAll').addEventListener('click', () => document.querySelectorAll('.entry:not(.hidden)').forEach(e => e.classList.add('expanded')));
document.getElementById('collapseAll').addEventListener('click', () => document.querySelectorAll('.entry').forEach(e => e.classList.remove('expanded')));
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  const cat = tab.dataset.cat;
  document.querySelectorAll('.entry').forEach(e => {
    if (cat === 'all' || e.dataset.cat === cat) { e.classList.remove('hidden'); } else { e.classList.add('hidden'); e.classList.remove('expanded'); }
  });
}));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.entry').forEach(el => el.classList.remove('expanded')); });
</script>
</body>
</html>
